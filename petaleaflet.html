<!DOCTYPE html>
<html lang="id">
    <head>
        <title>Peta city Depok</title>
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""/>

        <style>
            #map { height: 700px; }
        </style>

        <!-- Make sure you put this AFTER Leaflet's CSS -->
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
    </head>
    <body>
        <div id="map"></div>

        <script>
            var map = L.map('map').setView([-6.3525, 106.8442], 13);

            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
            }).addTo(map);

            var aoi = {
                type: "FeatureCollection",
                features: [
                {
                    type: "Feature",
                    properties: {
                    campus: "STT Nurul Fikri campus A",
                    city: "Depok",
                    addrres:
                        " Jl. Situ Indah 116, Tugu, Cimanggis, Depok, Jawa Barat.",
                    },
                    geometry: {
                    coordinates: [106.84976100000011, -6.359677331407653],
                    type: "Point",
                    },
                },
                {
                    type: "Feature",
                    properties: {
                    campus: "STT Nurul Fikri Kampus B",
                    city: "Jakarta Selatan",
                    addrres:
                        "Jl. Raya Lenteng Agung No.20-21, RT.4/RW.1, Srengseng Sawah, Kec. Jagakarsa, Jakarta Selatan",
                    },
                    geometry: {
                    coordinates: [106.83269999999902, -6.353004668523582],
                    type: "Point",
                    },
                },
                {
                    type: "Feature",
                    properties: {
                    campus: "Universitas Indoneia",
                    city: "Depok",
                    addrres:
                        "Jl. Lingkar, Pondok Cina, Kecamatan Beji, Kota Depok, Jawa Barat",
                    },
                    geometry: {
                    coordinates: [106.82944554232671, -6.363441104965773],
                    type: "Point",
                    },
                },
                {
                    type: "Feature",
                    properties: {
                    campus: "Universitas Pancasila",
                    city: "Jakarta Selatan",
                    addrres: "Jalan Srengseng Sawah, Jagakarsa, Jakarta Selatan",
                    },
                    geometry: {
                    coordinates: [106.83409400000062, -6.339831689053781],
                    type: "Point",
                    },
                },
                {
                    type: "Feature",
                    properties: {
                    campus: "Universitas Gunadarma",
                    city: "Depok",
                    addrres:
                        "Jalan Akses UI, Kelapa Dua, Tugu, Kec. Cimanggis, Kota Depok, Jawa Barat",
                    },
                    geometry: {
                    coordinates: [106.84255349999972, -6.354414179775006],
                    type: "Point",
                    },
                },
                {
                    type: "Feature",
                    properties: {
                    campus: "Politeknik Negeri Media Kreatif Jakarta",
                    city: "Jakarta Selatan",
                    addrres:
                        "Jl. Srengseng Sawah Raya No.17, RT.8/RW.3, Srengseng Sawah, Kec. Jagakarsa, Kota Jakarta Selatan, Daerah Khusus Ibucity Jakarta",
                    },
                    geometry: {
                    coordinates: [106.8270791865067, -6.347393027006973],
                    type: "Point",
                    },
                },
                ],
            };

            var geojson = L.geoJSON(aoi, {
                onEachFeature: function (feature, layer) {
                layer.bindPopup(
                    "Campus : " + feature.properties.campus +
                    "<br/> City : " +
                    feature.properties.city + "<br/> Address : " +
                    feature.properties.addrres
                );
                },
            }).addTo(map);

            
        </script>
    </body>
</html>
